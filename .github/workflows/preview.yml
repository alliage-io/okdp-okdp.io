name: Fork Pages Preview

on:
  push:
    branches-ignore:
      - master
      - gh-pages
  workflow_dispatch:

concurrency:
  group: preview-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: github.repository != 'OKDP/okdp.io'
    runs-on: ubuntu-latest
    permissions:
      # peaceiris/actions-gh-pages pushes the site to the gh-pages branch with
      # github_token (it does not use the checkout credentials).
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.12.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute preview location
        id: preview
        env:
          RAW_REF: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          slug=$(printf '%s' "$RAW_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g' \
            | sed 's#-\{2,\}#-#g' \
            | sed 's#^[-.]##; s#[-.]$##')

          if [ -z "$slug" ]; then
            slug="preview"
          fi

          site="https://${REPO_OWNER}.github.io"
          base="/${REPO_NAME}/previews/$slug/"

          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "path=previews/$slug" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "url=$site$base" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: npm run format:check

      - name: Build
        env:
          ASTRO_SITE: ${{ steps.preview.outputs.site }}
          ASTRO_BASE: ${{ steps.preview.outputs.base }}
        run: npm run build

      - name: Remove production custom domain
        run: rm -f dist/CNAME

      - name: Deploy preview to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.preview.outputs.path }}
          keep_files: true

      - name: Publish workflow summary
        env:
          BRANCH: ${{ github.ref_name }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          echo "## Preview published" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview URL: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Make sure GitHub Pages is enabled in the fork and configured to serve from the \`gh-pages\` branch." >> "$GITHUB_STEP_SUMMARY"
