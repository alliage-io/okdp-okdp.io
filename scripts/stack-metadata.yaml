# Presentation metadata for the stack inventory. Everything here is curated by
# hand because it cannot be derived from the charts (Chart.yaml, vendor.yaml) or
# the platform components of the deployments repository: display names, project
# homepages, and notices.
#
# `upstreamVersion` is an escape hatch, used only where the chart appVersion does
# not carry the version a reader expects. Each one needs a comment saying why.
# build-stack.mjs warns when a component has no entry here.

components:
  # ------------------------------------------------------------ data services
  airflow:
    name: Apache Airflow
    upstream: https://airflow.apache.org
  hive-metastore:
    name: Hive Metastore
    upstream: https://hive.apache.org
  jupyterhub:
    name: JupyterHub
    upstream: https://jupyter.org
  okdp-examples:
    name: OKDP Examples
    upstream: https://github.com/OKDP/okdp-examples
    description: Reference notebooks, datasets and OPA policies used by the sandbox.
  polaris:
    name: Apache Polaris
    upstream: https://polaris.apache.org
  spark-defaults:
    name: Spark Defaults
    description: Shared Spark configuration applied to every Spark application.
  spark-history-server:
    name: Spark History Server
    upstream: https://spark.apache.org
  spark-operator:
    name: Spark Operator
    upstream: https://github.com/kubeflow/spark-operator
  spark-rbac:
    name: Spark RBAC
    description: Namespace roles and bindings letting Spark applications run in a project.
  superset:
    name: Apache Superset
    upstream: https://superset.apache.org
  trino:
    name: Trino
    upstream: https://trino.io
    # The chart version is SemVer-shaped (480.0.0-X.Y.Z) because the console's
    # version parser requires it. Trino itself versions as a plain integer.
    upstreamVersion: "480"

  # ------------------------------------------------------------ control plane
  okdp-control-plane-server:
    name: OKDP Control Plane Server
    upstream: https://github.com/OKDP/okdp-control-plane-server
  okdp-control-plane-ui:
    name: OKDP Control Plane Console
    upstream: https://github.com/OKDP/okdp-control-plane-ui

  # -------------------------------------------------------------- dependencies
  cert-manager:
    name: cert-manager
    upstream: https://cert-manager.io
  cloudnative-pg:
    name: CloudNativePG
    upstream: https://cloudnative-pg.io
  cnpg-postgresql:
    name: PostgreSQL
    upstream: https://www.postgresql.org
    description: PostgreSQL clusters provisioned through CloudNativePG.
  coredns-patch:
    name: CoreDNS patch
    upstream: https://coredns.io
    description: Rewrites cluster DNS so platform hostnames resolve inside the sandbox.
  dns-server:
    name: DNS server
    upstream: https://coredns.io
    description: CoreDNS resolver serving the sandbox ingress suffix.
  external-secrets:
    name: External Secrets Operator
    upstream: https://external-secrets.io
    description: Generated passwords and cross-namespace credentials for every OKDP chart (API external-secrets.io/v1).
  gitea:
    name: Gitea
    upstream: https://about.gitea.com
    description: Git server hosting the deployments repository of the sandbox.
  ingress-nginx:
    name: Ingress NGINX
    upstream: https://github.com/kubernetes/ingress-nginx
    # Retired by the Kubernetes project on 19 Mar 2026: 4.15.1 is the final release,
    # no bugfixes, no security updates. Shipped by decision; the migration to another
    # controller is future work.
    notice:
      level: warning
      key: ingress-nginx-retired
  keycloak:
    name: Keycloak
    upstream: https://www.keycloak.org
    # The chart version tracks the codecentric keycloakx chart (7.3.2), not
    # Keycloak. The version users care about is the one of the official image
    # (quay.io/keycloak/keycloak), run in production mode.
    upstreamVersion: 26.7.4
  kubauth:
    name: kubauth
    description: OIDC authentication for kubectl against the platform identity provider.
  local-secrets-provider:
    name: Local secrets provider
    description: Sandbox credentials as Secrets replicated to every namespace, standing in for a real vault.
  seaweedfs:
    name: SeaweedFS
    upstream: https://github.com/seaweedfs/seaweedfs
    description: S3-compatible object store backing the lakehouse in the sandbox.
  tools:
    name: Platform tools
    description: Reloader and kubernetes-replicator, plus the deletion-protection admission policies.
  vault:
    name: HashiCorp Vault
    upstream: https://www.vaultproject.io
